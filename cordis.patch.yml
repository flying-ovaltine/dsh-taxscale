# DSH 组合包 patch —— 税衡 · 税务总监
# 仅声明元数据与三个 skill；功能由 skills/*/SKILL.md 承载。
- insert:
    - id: dsh-taxscale
      name: dsh-taxscale
      meta:
        version: "1.3.0"
        description: "Thirty-year tax director: statement forensics, voucher compliance review, tax computation and filing for Chinese enterprise and individual tax."
        author: "WorkBuddy"
        license: "MIT"
        keywords: ["tax", "finance", "compliance", "财税"]
        skills:
          - id: tax-diagnosis
            name: "财税合规检测"
            description: "读报表做勾稽验数、比对申报表差异、匹配优惠、测临界点、审合同条款、评估风险等级并出整改清单。"
            whenToUse: >-
              当用户提供财务报表、申报表或要求做税务体检、报表穿透、风险定级、
              优惠匹配、门槛临界点测算、合同税务条款审查、起草整改清单时使用。
          - id: tax-filing
            name: "报税测算与填报"
            description: "算各税种应纳税额、判断优惠、逐栏填申报表、备材料走流程、测个税汇算应补退。"
            whenToUse: >-
              当用户给出本期业务数据、要求计算增值税/附加/印花税/企业所得税预缴汇算/个税，
              或询问申报表栏次、减免代码、办税流程、报税材料时使用。
          - id: tax-review
            name: "单据合规审核"
            description: "逐张判断支出、发票、单据能否入账、抵扣、税前扣除，做三流一致与无票支出判断。"
            whenToUse: >-
              当用户提供一批凭证、发票或单据，要求判断是否可入账、进项能否抵扣、
              所得税能否扣除，或做凭证抽查、发票要素审核、三流一致性核对时使用。
